server {
    listen 80;
    server_name _;
    client_max_body_size 30m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    root /usr/share/nginx/html;

    # API, Django admin and static files -> Django
    location ~ ^/(api|django-admin|static)/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Every media request is authorised by Django first...
    location /media/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ...which then hands the file back to nginx through this internal-only path.
    location /_protected/ {
        internal;
        alias /data/media/;
        add_header Cache-Control "private, max-age=3600";
        add_header X-Content-Type-Options nosniff;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: every other path is the app
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
